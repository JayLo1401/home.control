name: home_control
description: "Home Assistant Quick Panel fuer Android TV"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Material Design Icons (@mdi/font 7.4.47) fuer HA-Symbole "mdi:..."
  assets:
    - assets/mdi/names.txt
  fonts:
    - family: MaterialDesignIcons
      fonts:
        - asset: assets/mdi/materialdesignicons.ttf
